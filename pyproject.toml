[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phosphor-terminal"
dynamic = ["version"]
description = "News and weather through the eras: a window app and a retro green-screen terminal"
license = { text = "GPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "windows-curses; sys_platform == 'win32'",
]
classifiers = [
    "Environment :: Console :: Curses",
    "Environment :: X11 Applications",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]

[project.scripts]
phosphor = "phosphor.app:main"

[project.gui-scripts]
phosphor-gui = "phosphor.gui:main"

[tool.setuptools.dynamic]
version = { attr = "phosphor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
